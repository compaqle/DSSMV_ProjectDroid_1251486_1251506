    <text x="1874" y="295" font-size="9.5" fill="#666">primeiro tomate verde</text>
    <rect x="1805" y="328" width="250" height="70" fill="#fff" stroke="#333"/>
    <rect x="1812" y="336" width="52" height="52" fill="#fff" stroke="#333"/>
    <path d="M1812 336 l52 52 M1864 336 l-52 52" stroke="#999"/>
    <text x="1874" y="353" font-size="10">30 set</text>
    <text x="1874" y="373" font-size="9.5" fill="#666">plantio</text>
    <rect x="1805" y="530" width="250" height="40" fill="#fff" stroke="#333"/>
    <text x="1930" y="555" font-size="12" text-anchor="middle">Voltar</text>
    <text x="1930" y="630" font-size="13" text-anchor="middle">DiarioPlantaActivity</text>
  </g>

  <!-- ===== 7. RegaPlantaActivity ===== -->
  <g>
    <rect x="2130" y="40" width="300" height="560" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="2130" y="40" width="300" height="44" rx="18" fill="#eee" stroke="#333" stroke-width="2"/>
    <rect x="2130" y="62" width="300" height="22" fill="#eee"/>
    <text x="2280" y="68" font-size="13" text-anchor="middle" font-weight="bold">Rega da Planta</text>
    <text x="2155" y="126" font-size="13" font-weight="bold" text-anchor="middle">Tomatinho do vaso 1</text>
    <text x="2155" y="180" font-size="11">Ultima rega: ha 2 dias</text>
    <text x="2155" y="215" font-size="11">Proxima rega: em 1 dia</text>
    <text x="2155" y="250" font-size="10" fill="#666">Solo abaixo do minimo</text>
    <rect x="2155" y="300" width="250" height="45" fill="#fff" stroke="#333"/>
    <text x="2280" y="328" font-size="12" text-anchor="middle">Regar Planta</text>
    <rect x="2155" y="355" width="250" height="45" fill="#fff" stroke="#333"/>
    <text x="2280" y="383" font-size="12" text-anchor="middle">Voltar</text>
    <text x="2280" y="630" font-size="13" text-anchor="middle">RegaPlantaActivity</text>
  </g>

  <!-- navigation arrows -->
  <path d="M185 605 C 210 700, 480 700, 520 605" stroke="#000" fill="none" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M340 250 L 720 250" stroke="#000" fill="none" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M1035 330 L 1070 330" stroke="#000" fill="none" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M1385 330 L 1420 330" stroke="#000" fill="none" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M1230 400 L 1230 720 L 1930 720" stroke="#000" fill="none" stroke-width="1.4" marker-end="url(#arr)"/>
