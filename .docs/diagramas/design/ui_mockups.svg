<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1050" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="2500" height="1050" fill="#fff"/>

  <!-- ===== 1. MainActivity (menu) ===== -->
  <g>
    <rect x="30" y="40" width="300" height="560" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="30" y="40" width="300" height="44" rx="18" fill="#eee" stroke="#333" stroke-width="2"/>
    <rect x="30" y="62" width="300" height="22" fill="#eee"/>
    <text x="180" y="68" font-size="14" text-anchor="middle" font-weight="bold">PlantKeep</text>
    <text x="180" y="130" font-size="13" text-anchor="middle" font-weight="bold">PlantKeep</text>
    <text x="180" y="155" font-size="11" text-anchor="middle">A carregar meteorologia e avisos...</text>
    <text x="180" y="195" font-size="12" font-weight="bold" text-anchor="middle">Avisos Meteorologicos</text>
    <rect x="55" y="205" width="250" height="120" fill="#fff" stroke="#333"/>
    <text x="180" y="270" font-size="10" fill="#999" text-anchor="middle">lista de avisos</text>
    <rect x="55" y="360" width="250" height="45" fill="#fff" stroke="#333"/>
    <text x="180" y="388" font-size="12" text-anchor="middle">Criar Planta</text>
    <rect x="55" y="420" width="250" height="45" fill="#fff" stroke="#333"/>
    <text x="180" y="448" font-size="12" text-anchor="middle">Ver Plantas</text>
    <text x="180" y="630" font-size="13" text-anchor="middle">MainActivity</text>
  </g>

  <!-- ===== 2. CriarPlantaActivity ===== -->
  <g>
    <rect x="380" y="40" width="300" height="560" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="380" y="40" width="300" height="44" rx="18" fill="#eee" stroke="#333" stroke-width="2"/>
    <rect x="380" y="62" width="300" height="22" fill="#eee"/>
    <text x="530" y="68" font-size="13" text-anchor="middle" font-weight="bold">Adicionar planta</text>
    <text x="405" y="120" font-size="11">Escreve o nome da especie:</text>
    <rect x="405" y="130" width="215" height="28" fill="#fff" stroke="#333"/>
    <text x="412" y="149" font-size="10" fill="#999">Ex. tomate</text>
    <rect x="627" y="130" width="53" height="28" fill="#fff" stroke="#333"/>
    <text x="653" y="149" font-size="10" text-anchor="middle">Pesquisar</text>
    <text x="405" y="185" font-size="11">Escolhe a especie encontrada:</text>
    <rect x="405" y="195" width="275" height="100" fill="#fff" stroke="#333"/>
    <line x1="412" y1="225" x2="673" y2="225" stroke="#bbb"/>
    <line x1="412" y1="252" x2="673" y2="252" stroke="#bbb"/>
    <text x="412" y="220" font-size="10">Solanum lycopersicum</text>
    <text x="412" y="247" font-size="10">Solanum tuberosum</text>
    <text x="405" y="325" font-size="11">Nome para identificares:</text>
    <rect x="405" y="335" width="275" height="30" fill="#fff" stroke="#333"/>
    <text x="412" y="355" font-size="9.5" fill="#999">Nome (ex. Tomatinho do vaso 1)</text>
    <rect x="450" y="395" width="185" height="42" fill="#fff" stroke="#333"/>
    <text x="542" y="421" font-size="11" text-anchor="middle">Guardar planta</text>
    <text x="530" y="630" font-size="13" text-anchor="middle">CriarPlantaActivity</text>
  </g>

  <!-- ===== 3. PlantasActivity ===== -->
  <g>
    <rect x="730" y="40" width="300" height="560" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="730" y="40" width="300" height="44" rx="18" fill="#eee" stroke="#333" stroke-width="2"/>
    <rect x="730" y="62" width="300" height="22" fill="#eee"/>
    <text x="880" y="68" font-size="13" text-anchor="middle" font-weight="bold">Plantas existentes</text>
    <rect x="755" y="100" width="250" height="64" fill="#fff" stroke="#333"/>
    <rect x="763" y="106" width="50" height="50" fill="#fff" stroke="#333"/>
    <path d="M763 106 l50 50 M813 106 l-50 50" stroke="#999"/>
    <text x="823" y="126" font-size="11" font-weight="bold">Tomatinho do vaso 1</text>
    <text x="823" y="146" font-size="10" fill="#666">Solanum lycopersicum</text>
    <rect x="755" y="175" width="250" height="64" fill="#fff" stroke="#333"/>
    <rect x="763" y="181" width="50" height="50" fill="#fff" stroke="#333"/>
    <path d="M763 181 l50 50 M813 181 l-50 50" stroke="#999"/>
    <text x="823" y="201" font-size="11" font-weight="bold">Batateira horta</text>
    <text x="823" y="221" font-size="10" fill="#666">Solanum tuberosum</text>
    <rect x="755" y="530" width="250" height="40" fill="#fff" stroke="#333"/>
    <text x="880" y="555" font-size="12" text-anchor="middle">Voltar</text>
    <text x="880" y="630" font-size="13" text-anchor="middle">PlantasActivity</text>
  </g>

  <!-- ===== 4. InfoPlantaActivity ===== -->
  <g>
    <rect x="1080" y="40" width="300" height="560" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="1080" y="40" width="300" height="44" rx="18" fill="#eee" stroke="#333" stroke-width="2"/>
    <rect x="1080" y="62" width="300" height="22" fill="#eee"/>
    <text x="1230" y="68" font-size="13" text-anchor="middle" font-weight="bold">Tomatinho do vaso 1</text>
    <rect x="1104" y="100" width="252" height="130" fill="#e0e0e0" stroke="#333"/>
    <text x="1230" y="170" font-size="10" text-anchor="middle" fill="#777">imagem da especie</text>
    <rect x="1104" y="245" width="252" height="130" fill="#fff" stroke="#333"/>
    <text x="1112" y="265" font-size="10" font-weight="bold">Temperatura: 18 - 30 C</text>
    <text x="1112" y="285" font-size="10" font-weight="bold">Humidade do solo: 22 - 65 %</text>
    <text x="1112" y="305" font-size="10" font-weight="bold">Luz: 2000 - 25000 lux</text>
    <text x="1112" y="325" font-size="10" font-weight="bold">Humidade ambiente: 40 - 80 %</text>
    <text x="1112" y="350" font-size="10">Regar: a cada 3 dias</text>
    <rect x="1104" y="395" width="252" height="40" fill="#fff" stroke="#333"/>
    <text x="1230" y="420" font-size="11" text-anchor="middle">Diario da Planta</text>
    <rect x="1104" y="443" width="252" height="40" fill="#fff" stroke="#333"/>
    <text x="1230" y="468" font-size="11" text-anchor="middle">Rega da Planta</text>
    <rect x="1104" y="491" width="252" height="40" fill="#fff" stroke="#333"/>
    <text x="1230" y="516" font-size="11" text-anchor="middle">Verificar luz</text>
    <rect x="1104" y="539" width="252" height="40" fill="#fff" stroke="#333"/>
    <text x="1230" y="564" font-size="11" text-anchor="middle">Apagar planta</text>
    <text x="1230" y="630" font-size="13" text-anchor="middle">InfoPlantaActivity</text>
  </g>

  <!-- ===== 5. MedirLuzActivity ===== -->
  <g>
    <rect x="1430" y="40" width="300" height="560" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="1430" y="40" width="300" height="44" rx="18" fill="#eee" stroke="#333" stroke-width="2"/>
    <rect x="1430" y="62" width="300" height="22" fill="#eee"/>
    <text x="1580" y="68" font-size="13" text-anchor="middle" font-weight="bold">Verificar luz</text>
    <rect x="1480" y="160" width="200" height="44" fill="#fff" stroke="#333"/>
    <text x="1580" y="187" font-size="11" text-anchor="middle">Fazer Medicao 1/3</text>
    <text x="1580" y="260" font-size="16" text-anchor="middle">4850 lux</text>
    <text x="1580" y="290" font-size="11" text-anchor="middle">Adequada para a especie</text>
    <text x="1580" y="630" font-size="13" text-anchor="middle">MedirLuzActivity</text>
  </g>

  <!-- ===== 6. DiarioPlantaActivity ===== -->
  <g>
    <rect x="1780" y="40" width="300" height="560" rx="18" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="1780" y="40" width="300" height="44" rx="18" fill="#eee" stroke="#333" stroke-width="2"/>
    <rect x="1780" y="62" width="300" height="22" fill="#eee"/>
    <text x="1930" y="68" font-size="13" text-anchor="middle" font-weight="bold">Diario da Planta</text>
    <text x="1805" y="115" font-size="11" font-weight="bold">Diario da Planta</text>
    <rect x="1805" y="125" width="250" height="34" fill="#fff" stroke="#333"/>
    <text x="1812" y="147" font-size="9.5" fill="#999">Escreve aqui o teu registo</text>
    <rect x="1805" y="168" width="118" height="38" fill="#fff" stroke="#333"/>
    <text x="1864" y="192" font-size="11" text-anchor="middle">Tirar Foto</text>
    <rect x="1937" y="168" width="118" height="38" fill="#fff" stroke="#333"/>
    <text x="1996" y="192" font-size="11" text-anchor="middle">Guardar Registo</text>
    <text x="1805" y="240" font-size="11" font-weight="bold">Historico de Registos</text>
    <rect x="1805" y="250" width="250" height="70" fill="#fff" stroke="#333"/>
    <rect x="1812" y="258" width="52" height="52" fill="#fff" stroke="#333"/>
    <path d="M1812 258 l52 52 M1864 258 l-52 52" stroke="#999"/>
